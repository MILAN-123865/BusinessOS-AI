version: '3.8'

services:
  gateway:
    image: nginx:alpine
    container_name: businessos_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

  db:
    image: postgres:15-alpine
    container_name: businessos_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-businessos_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-businessos}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: businessos_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    restart: always

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: businessos_backend_prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-businessos_secure_password}@db:5432/${POSTGRES_DB:-businessos}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-default_high_entropy_secret_at_least_32_chars_prod}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-default_refresh_secret_at_least_32_chars_prod}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: businessos_frontend_prod
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
